<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <radialGradient id="glowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0015"/>
    </radialGradient>
    <radialGradient id="ghostGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="200" height="220" fill="url(#glowBg)"/>

  <!-- Moon -->
  <circle cx="160" cy="30" r="18" fill="#fffbe6" opacity="0.9"/>
  <circle cx="168" cy="24" r="14" fill="#1a0a2e"/>

  <!-- Floating particles -->
  <circle cx="30" cy="50" r="2" fill="#88aaff" opacity="0.7">
    <animate attributeName="cy" values="50;40;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="80" r="1.5" fill="#88aaff" opacity="0.5">
    <animate attributeName="cy" values="80;68;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="170" r="1.5" fill="#aaffee" opacity="0.4">
    <animate attributeName="cy" values="170;158;170" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Ghost glow aura -->
  <ellipse cx="100" cy="105" rx="55" ry="65" fill="url(#ghostGlow)" filter="url(#blur)">
    <animate attributeName="ry" values="65;70;65" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ghost body (floating) -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.5s" repeatCount="indefinite" additive="sum"/>

    <!-- Ghost main body -->
    <path d="M60,110 Q60,55 100,52 Q140,55 140,110 L140,165
             Q130,157 120,165 Q110,172 100,163 Q90,155 80,163 Q70,172 60,165 Z"
          fill="#d0eeff" opacity="0.92"/>

    <!-- Ghost inner shadow top -->
    <path d="M70,110 Q70,65 100,63 Q130,65 130,110" fill="none" stroke="#a0cfee" stroke-width="1" opacity="0.4"/>

    <!-- Scary hollow eyes -->
    <ellipse cx="83" cy="108" rx="11" ry="14" fill="#0a0015"/>
    <ellipse cx="117" cy="108" rx="11" ry="14" fill="#0a0015"/>

    <!-- Eye glow (red pupils) -->
    <ellipse cx="83" cy="110" rx="5" ry="6" fill="#cc0000" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="117" cy="110" rx="5" ry="6" fill="#cc0000" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.4;0.85" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Scary mouth -->
    <path d="M82,132 Q90,145 100,140 Q110,145 118,132" fill="#0a0015" stroke="#0a0015" stroke-width="1"/>
    <!-- Jagged teeth -->
    <polygon points="86,132 89,140 92,132" fill="white" opacity="0.9"/>
    <polygon points="94,133 97,142 100,133" fill="white" opacity="0.9"/>
    <polygon points="102,133 105,142 108,133" fill="white" opacity="0.9"/>
    <polygon points="110,132 113,140 116,132" fill="white" opacity="0.9"/>

    <!-- Ghost wispy arms -->
    <path d="M60,120 Q40,115 38,128 Q36,140 55,138" fill="#d0eeff" opacity="0.75"/>
    <path d="M140,120 Q160,115 162,128 Q164,140 145,138" fill="#d0eeff" opacity="0.75"/>

    <!-- Bottom wavy edge highlight -->
    <path d="M60,155 Q70,148 80,155 Q90,162 100,154 Q110,147 120,154 Q130,161 140,155"
          fill="none" stroke="#a0cfee" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Ground fog -->
  <ellipse cx="100" cy="210" rx="60" ry="10" fill="#5588cc" opacity="0.15" filter="url(#blur)"/>

  <!-- "BOO" text -->
  <text x="100" y="210" text-anchor="middle" font-family="serif" font-size="13" font-weight="bold"
        fill="#88ccff" opacity="0.6" letter-spacing="4">BOO</text>
</svg>
